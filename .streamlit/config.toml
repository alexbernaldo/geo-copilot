[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = true

[browser]
gatherUsageStats = false

[theme]
font = "Geist"
codeFont = "Geist Mono"
baseRadius = "0.5rem"
buttonRadius = "0.5rem"
showWidgetBorder = true

[theme.light]
primaryColor = "#14161B"
backgroundColor = "#F6F7F9"
secondaryBackgroundColor = "#EEF0F3"
textColor = "#0E1116"
borderColor = "#D5D9E0"
linkColor = "#1E4FA3"

[theme.dark]
primaryColor = "#ECEEF2"
backgroundColor = "#0C0E12"
secondaryBackgroundColor = "#1B1F26"
textColor = "#ECEEF2"
borderColor = "#2E343F"
linkColor = "#8AB4FF"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin.woff2"
weight = "100 900"
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-ext.woff2"
weight = "100 900"
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/geistmono-latin.woff2"
weight = "100 900"
