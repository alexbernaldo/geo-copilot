components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            detail:
              type: object
              additionalProperties: true
          required:
          - code
          - message
      required:
      - error
    OriginTag:
      type: object
      properties:
        origen:
          type: string
          enum:
          - calculado
          - ia
          - automatico
          - editado
        modelo:
          type: string
          nullable: true
      required:
      - origen
    Checkpoints:
      type: object
      properties:
        ficha:
          type: boolean
        competencia:
          type: boolean
        hallazgos:
          type: boolean
        plan:
          type: boolean
      required:
      - ficha
      - competencia
      - hallazgos
      - plan
    Project:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        tipo:
          type: string
          enum:
          - cliente
          - prospecto
        marca:
          type: string
          nullable: true
        sector:
          type: string
          nullable: true
        origen_datos:
          type: string
          enum:
          - csv
          - vivo
          nullable: true
        revision:
          type: string
          enum:
          - pausas
          - continuo
        estado:
          type: string
          enum:
          - borrador
          - listo_para_lanzar
          - en_ejecucion
          - esperando_revision
          - completado
          - error
          - interrumpido
        punto_control_pendiente:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
          nullable: true
        checkpoints:
          $ref: '#/components/schemas/Checkpoints'
        coste_eur:
          type: number
        creado:
          type: string
          format: date-time
        actualizado:
          type: string
          format: date-time
        archivado:
          type: boolean
      required:
      - id
      - nombre
      - tipo
      - revision
      - estado
      - checkpoints
      - coste_eur
      - creado
      - actualizado
      - archivado
    ProjectCreate:
      type: object
      properties:
        nombre:
          type: string
        tipo:
          type: string
          enum:
          - cliente
          - prospecto
      required:
      - nombre
      - tipo
    ProjectPatch:
      type: object
      properties:
        nombre:
          type: string
        revision:
          type: string
          enum:
          - pausas
          - continuo
        archivado:
          type: boolean
    ProgressStep:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        estado:
          type: string
          enum:
          - pendiente
          - en_curso
          - hecho
          - hecho_automatico
          - error
          - esperando_revision
        duracion_s:
          type: number
          nullable: true
        llamadas:
          type: integer
        coste_eur:
          type: number
        error:
          type: string
          nullable: true
      required:
      - id
      - nombre
      - estado
    Progress:
      type: object
      properties:
        estado:
          type: string
          enum:
          - en_ejecucion
          - esperando_revision
          - completado
          - error
          - interrumpido
        paso_actual:
          type: string
          nullable: true
        pasos:
          type: array
          items:
            $ref: '#/components/schemas/ProgressStep'
        contador:
          type: object
          properties:
            paso:
              type: string
            hechos:
              type: integer
            total:
              type: integer
          required:
          - paso
          - hechos
          - total
          nullable: true
        llamadas:
