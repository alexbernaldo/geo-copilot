      operationId: post_projects_id_run
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmaCoste'
            example:
              confirmo_coste: true
      responses:
        '202':
          description: Aceptado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
              example:
                estado: en_ejecucion
                paso_actual: judge
                pasos:
                - id: intake
                  nombre: Ficha
                  estado: hecho
                  duracion_s: 1.2
                  llamadas: 0
                  coste_eur: 0.0
                  error: null
                - id: judge
                  nombre: Juez
                  estado: en_curso
                  duracion_s: null
                  llamadas: 214
                  coste_eur: 0.41
                  error: null
                contador:
                  paso: judge
                  hechos: 214
                  total: 624
                llamadas: 214
                coste_eur: 0.41
                coste_real: true
                transcurrido_s: 93.4
        '404':
