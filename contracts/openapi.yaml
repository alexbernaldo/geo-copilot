      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudySummary'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/study/brands/propose:
    post:
