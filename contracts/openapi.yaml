        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      summary: Banco de prompts del estudio
      tags:
      - study
      operationId: get_projects_id_study_prompts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromptsPayload'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/study/prompts/instances:
