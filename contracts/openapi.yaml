  /estimates/study:
    get:
      summary: Estimación del estudio en vivo
      tags:
      - estimates
      operationId: get_estimates_study
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Estimate'
              example:
                pasos:
                - id: judge
                  nombre: Juez
                  llamadas: 624
                  tokens_in: 900000
                  tokens_out: 90000
                  eur: 1.1
                total_llamadas: 624
                total_eur: 1.1
                minutos: 6.5
                supera_tope: false
                tope_eur: 15.0
        '404':
          $ref: '#/components/responses/NotFound'
  /estimates/analysis:
