openapi: 3.0.3
info:
  license:
    name: Uso interno
  title: Preload API
  version: 1.0.0
  description: Contrato de la API (fuente de verdad). Todas las rutas van bajo /api. Textos de error en español. Ninguna GET llama a OpenRouter.
servers:
- url: /api
tags:
- name: projects
- name: inputs
- name: study
- name: estimates
- name: run
- name: ficha
- name: market
- name: findings
- name: plan
- name: checkpoints
- name: results
- name: exports
- name: quality
- name: traces
- name: settings
- name: meta
security: []
paths:
  /projects:
    get:
      summary: Lista de proyectos
      tags:
      - projects
      operationId: get_projects
      parameters:
      - name: estado
        in: query
        required: false
        schema:
          type: string
      - name: q
        in: query
        required: false
        schema:
          type: string
      - name: archivados
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
              example:
              - id: p_20261021_153012_ab12cd
                nombre: Academia Lingua
                tipo: cliente
                marca: Academia Lingua
                sector: Educación
                origen_datos: csv
                revision: pausas
                estado: esperando_revision
                punto_control_pendiente: 1
                checkpoints:
                  ficha: true
                  competencia: false
                  hallazgos: false
                  plan: false
                coste_eur: 0.0
                creado: '2026-10-21T15:30:12Z'
                actualizado: '2026-10-21T15:42:03Z'
                archivado: false
    post:
      summary: Crea un borrador
      tags:
      - projects
      operationId: post_projects
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            example:
              nombre: Academia Lingua
              tipo: cliente
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: p_20261021_153012_ab12cd
                nombre: Academia Lingua
                tipo: cliente
                marca: Academia Lingua
                sector: Educación
                origen_datos: csv
                revision: pausas
                estado: esperando_revision
                punto_control_pendiente: 1
                checkpoints:
                  ficha: true
                  competencia: false
                  hallazgos: false
                  plan: false
                coste_eur: 0.0
                creado: '2026-10-21T15:30:12Z'
                actualizado: '2026-10-21T15:42:03Z'
                archivado: false
        '422':
          $ref: '#/components/responses/Unprocessable'
  /projects/{id}:
    get:
      summary: Detalle del proyecto
      tags:
      - projects
      operationId: get_projects_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: p_20261021_153012_ab12cd
                nombre: Academia Lingua
                tipo: cliente
                marca: Academia Lingua
                sector: Educación
                origen_datos: csv
                revision: pausas
                estado: esperando_revision
                punto_control_pendiente: 1
                checkpoints:
                  ficha: true
                  competencia: false
                  hallazgos: false
                  plan: false
                coste_eur: 0.0
                creado: '2026-10-21T15:30:12Z'
                actualizado: '2026-10-21T15:42:03Z'
                archivado: false
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      summary: Renombrar, revisión o archivar
      tags:
      - projects
      operationId: patch_projects_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
            example:
              revision: continuo
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: p_20261021_153012_ab12cd
                nombre: Academia Lingua
                tipo: cliente
                marca: Academia Lingua
                sector: Educación
                origen_datos: csv
                revision: pausas
                estado: esperando_revision
                punto_control_pendiente: 1
                checkpoints:
                  ficha: true
                  competencia: false
                  hallazgos: false
                  plan: false
                coste_eur: 0.0
                creado: '2026-10-21T15:30:12Z'
                actualizado: '2026-10-21T15:42:03Z'
                archivado: false
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
    delete:
      summary: Borrar (requiere ?confirm=<nombre>)
      tags:
      - projects
      operationId: delete_projects_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: confirm
        in: query
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Borrado
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '423':
          $ref: '#/components/responses/Locked'
  /projects/{id}/duplicate:
    post:
      summary: Duplica entradas y configuración
      tags:
      - projects
      operationId: post_projects_id_duplicate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: p_20261021_153012_ab12cd
                nombre: Academia Lingua
                tipo: cliente
                marca: Academia Lingua
                sector: Educación
                origen_datos: csv
                revision: pausas
                estado: esperando_revision
                punto_control_pendiente: 1
                checkpoints:
                  ficha: true
                  competencia: false
                  hallazgos: false
                  plan: false
                coste_eur: 0.0
                creado: '2026-10-21T15:30:12Z'
                actualizado: '2026-10-21T15:42:03Z'
                archivado: false
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{id}/brief:
    post:
      summary: Sube el brief (multipart) o pega texto; devuelve vista previa de la ficha
      tags:
      - inputs
      operationId: post_projects_id_brief
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivo:
                  type: string
                  format: binary
          application/json:
            schema:
              $ref: '#/components/schemas/BriefText'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
  /projects/{id}/prospect:
    post:
      summary: Datos de la marca prospecto
      tags:
      - inputs
      operationId: post_projects_id_prospect
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProspectData'
            example:
              marca: Academia Lingua
              dominio: lingua.example
              sector: Educación
              ciudad: Valencia
              competidores: []
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FichaPreview'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /projects/{id}/study/upload:
    post:
      summary: Sube CSV (varios); informe de validación por archivo
      tags:
      - study
      operationId: post_projects_id_study_upload
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archivos:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '423':
          $ref: '#/components/responses/Locked'
  /projects/{id}/study/summary:
    get:
      summary: Resumen del estudio cargado o generado
