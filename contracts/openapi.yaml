              $ref: '#/components/schemas/BrandsPayload'
      responses:
        '200':
          description: Correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandsPayload'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
    get:
      summary: Marcas del estudio
      tags:
      - study
      operationId: get_projects_id_study_brands
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Correcto
          content:
