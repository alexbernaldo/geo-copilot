          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyConfig'
            example:
              tamano: rapido
              motores:
              - ChatGPT
              - Gemini
              - Perplexity
              - Claude
              repeticiones: 2
      responses:
        '200':
          description: Correcto
          content:
            application/json:
