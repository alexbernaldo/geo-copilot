id: salud
extiende: general
descripcion: Sector sanitario (publicidad sanitaria regulada).
detectar_si: ["clínica", "hospital", "médic", "sanitari", "sanidad", "oftalm", "dental", "fisioterap", "farmac"]

normativa:
  descripcion: >-
    Publicidad sanitaria regulada: sin promesas de resultados ni comparativas denigratorias.
  prohibidas_regex:
    - patron: '\bgarantiza(?:mos|n|do|da|r)?\b'
      sugerencia: Sustituir garantías absolutas por rangos orientativos sujetos a valoración médica o re-medición.
    - patron: '\bresultados?\s+asegurados?\b'
      sugerencia: Eliminar 'resultados asegurados'; en sanidad y GEO no se pueden prometer resultados.
    - patron: '\b100\s*%\s*(?:de\s+)?(?:éxito|exito|eficacia|seguro|efectivo)\b'
      sugerencia: Retirar afirmaciones del '100 % de éxito/eficacia'; usar datos clínicos verificables.
    - patron: '\b(?:el\s+mejor\s+centro|la\s+mejor\s+cl[ií]nica)\b'
      sugerencia: Evitar superlativos absolutos ('la mejor clínica'); describir hechos y diferenciales verificables.
    - patron: '\bsin\s+riesgos?\b'
      sugerencia: Retirar 'sin riesgo'; toda intervención médica conlleva consideraciones clínicas que evalúa el especialista.

responsables: [cliente_marketing, cliente_comunicacion, cliente_medico, agencia, tercero]

fases:
  0:
    objetivo: "Asegurar que los bots de IA rastreen la web sin fricción y comprendan la entidad médica, las sedes y el cuadro facultativo de {marca}."

plan:
  riesgos:
    - "No determinismo y actualizaciones de los modelos de IA: las respuestas varían entre ejecuciones y por cambios de pesos de cada proveedor."
    - "Tiempos de indexación y refresco de fuentes de terceros (rankings, directorios y prensa sanitaria)."
    - "Sensibilidad regulatoria en publicidad sanitaria: toda pieza requiere validación médico-legal previa sin promesas de resultado."
    - "Disponibilidad del equipo interno del cliente en semanas de lanzamiento de contenidos."

acciones:
  TPL-01:
    titulo: "Datos estructurados schema.org (MedicalClinic, Physician, FAQPage)"
    descripcion: "Implementar marcado JSON-LD completo en las fichas de {servicios_prioritarios} y sedes de {ciudades}, vinculando cuadro médico y acreditaciones."
    entregables_tipo:
      - "Especificación JSON-LD por tipo de página (MedicalClinic, Physician, FAQPage)"
      - "Validación en Rich Results Test y Schema Markup Validator"
  TPL-03:
    titulo: "Normalización de entidad y NAP en directorios sanitarios citados ({dom_directorios_coma})"
    descripcion: "Unificar nombre oficial, sedes ({ciudades}), especialidades, cuadro médico y horarios en {dom_directorios}."
  TPL-09:
    titulo: "Contenido de puesta en valor del diferencial asistencial de {marca}"
    descripcion: "Explicar con rigor médico el diferencial de {marca} ({diferencial}), respondiendo a la principal inquietud del paciente sin nombrar ni comparar con terceros."
    kpi_tipo: "Incremento de menciones de recomendación activa basadas en el diferencial asistencial"
    entregables_tipo:
      - "Guía clínica del diferencial asistencial firmada por el equipo médico"
      - "Infografía del proceso asistencial paso a paso"
  TPL-10:
    titulo: "Guías específicas por perfil de paciente"
    descripcion: "Crear guías clínicas dedicadas a cada perfil de paciente objetivo de {marca}, enfocadas en {servicios_prioritarios}."
  TPL-15:
    titulo: "Fichas individuales del cuadro médico con colegiación, publicaciones y subespecialidad"
    descripcion: "Reforzar criterios E-E-A-T sanitarios mediante perfiles detallados de cada especialista de {marca} en {ciudades}, enlazados como revisores de las guías médicas."
    kpi_tipo: "Perfiles médicos completos con marcado Physician y autoría clínica visible"
    entregables_tipo:
      - "Páginas de perfil médico con número de colegiado y experiencia"
      - "Sello de revisión médica con fecha en las URLs informativas"
  TPL-16:
    titulo: "Optimización de conversión de citas y gestión de expectativas en franjas horarias"
    descripcion: "Atender las menciones puntuales sobre disponibilidad de franjas de cita mediante agenda online visible y tiempos medios de espera transparentes por sede."
